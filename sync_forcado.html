<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Sync Forçado v3</title>
<style>
  body { font-family: monospace; background: #111; color: #eee; padding: 20px; }
  h2 { color: #f0d070; }
  .btn { padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; margin: 6px; }
  .verde { background: #22c55e; color: #000; }
  .azul  { background: #3b82f6; color: #fff; }
  .ouro  { background: #c9a84c; color: #000; }
  pre { background: #1a1a1a; padding: 12px; border-radius: 8px; font-size: 13px; max-height: 500px; overflow-y: auto; white-space: pre-wrap; }
  .ok   { color: #22c55e; }
  .err  { color: #ef4444; }
  .warn { color: #f0d070; }
  .stat { display:inline-block; background:#1a1a1a; border:1px solid #333; border-radius:8px; padding:12px 20px; margin:6px; text-align:center; }
  .num  { font-size:28px; font-weight:bold; color:#f0d070; }
</style>
</head>
<body>
<h2>🔧 Sync Forçado v3</h2>
<p style="color:#f0d070">⚠️ Abra no Chrome onde usa o sistema normalmente (NÃO em aba anônima)</p>

<div id="stats" style="margin:16px 0;">
  <div class="stat"><div class="num" id="n-local">?</div><div>localStorage</div></div>
  <div class="stat"><div class="num" id="n-fb">?</div><div>Firebase</div></div>
</div>

<button class="btn ouro" onclick="verificar()">🔍 Verificar</button>
<button class="btn verde" onclick="sincronizar()">⬆️ Sincronizar localStorage → Firebase</button>
<button class="btn azul"  onclick="window.location.href='https://websalaov2.vercel.app'">🔁 Abrir Sistema</button>

<pre id="log">Aguardando...</pre>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, getDocs, writeBatch, doc }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const cfg = {
  apiKey: 'AIzaSyBQcTGkiastpRAjGthU9nHy_uqpQjUMdu0',
  authDomain: 'websalao-2a9d1.firebaseapp.com',
  projectId: 'websalao-2a9d1',
  storageBucket: 'websalao-2a9d1.firebasestorage.app',
  messagingSenderId: '731611795568',
  appId: '1:731611795568:web:103e44f116e152961024b5'
};
const db = getFirestore(initializeApp(cfg));

const logEl = document.getElementById('log');
function log(msg, t='') {
  const ts = new Date().toLocaleTimeString('pt-BR');
  logEl.innerHTML += `<span class="${t||'info'}">[${ts}] ${msg}</span>\n`;
  logEl.scrollTop = logEl.scrollHeight;
}

function getLocal(k) { try { return JSON.parse(localStorage.getItem(k))||[]; } catch { return []; } }

async function batchSet(col, items) {
  for (let i=0; i<items.length; i+=499) {
    const chunk = items.slice(i,i+499);
    const batch = writeBatch(db);
    chunk.forEach(item => {
      const id = String(item.id !== undefined ? item.id : i);
      batch.set(doc(db, col, id), item, {merge:true});
    });
    await batch.commit();
  }
}

window.verificar = async function() {
  logEl.innerHTML = '';
  const ag  = getLocal('agendamentos');
  const wpp = getLocal('wppMensagens');
  log(`localStorage: ${ag.length} agendamentos, ${wpp.length} wppMensagens`, ag.length > 0 ? 'ok' : 'err');
  
  const snap = await getDocs(collection(db, 'agendamentos'));
  log(`Firebase: ${snap.docs.length} agendamentos`, snap.docs.length > 0 ? 'ok' : 'warn');
  
  document.getElementById('n-local').textContent = ag.length;
  document.getElementById('n-fb').textContent = snap.docs.length;
  
  if (ag.length === 0) {
    log('⚠️ localStorage VAZIO neste browser — abra o sistema no browser correto!', 'err');
  } else if (snap.docs.length < ag.length) {
    log(`${ag.length - snap.docs.length} agendamentos faltam no Firebase → clique em Sincronizar`, 'warn');
  } else {
    log('Firebase e localStorage estão sincronizados!', 'ok');
  }
};

window.sincronizar = async function() {
  const ag  = getLocal('agendamentos');
  const wpp = getLocal('wppMensagens');
  const cli = getLocal('clientes');
  const svc = getLocal('servicos');
  const fin = getLocal('financeiro');
  
  if (ag.length === 0) {
    log('❌ localStorage vazio! Abra este arquivo no browser onde usa o sistema.', 'err');
    return;
  }
  
  log(`Enviando ${ag.length} agendamentos...`, 'warn');
  await batchSet('agendamentos', ag);
  log(`✅ ${ag.length} agendamentos enviados!`, 'ok');
  
  log(`Enviando ${wpp.length} mensagens WPP...`, 'warn');
  await batchSet('wppMensagens', wpp);
  log(`✅ ${wpp.length} mensagens enviadas!`, 'ok');
  
  if(cli.length) { await batchSet('clientes', cli); log(`✅ ${cli.length} clientes`, 'ok'); }
  if(svc.length) { await batchSet('servicos', svc); log(`✅ ${svc.length} serviços`, 'ok'); }
  if(fin.length) { await batchSet('financeiro', fin); log(`✅ ${fin.length} financeiro`, 'ok'); }
  
  log('🎉 SINCRONIZAÇÃO COMPLETA! Clique em Abrir Sistema.', 'ok');
  await window.verificar();
};

setTimeout(window.verificar, 500);
</script>
</body>
</html>
