<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Migrar Dados Shelly → Firebase</title>
<style>
  body { font-family: monospace; background: #111; color: #eee; padding: 20px; max-width: 800px; }
  h2 { color: #f0d070; }
  .card { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 16px; margin: 12px 0; }
  .ok { color: #22c55e; } .err { color: #ef4444; } .warn { color: #f0d070; }
  .btn { padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: bold; margin: 6px; }
  .verde { background: #22c55e; color: #000; }
  .ouro  { background: #c9a84c; color: #000; }
  .azul  { background: #3b82f6; color: #fff; }
  pre { background: #0a0a0a; padding: 12px; border-radius: 6px; font-size: 13px; max-height: 400px; overflow-y: auto; white-space: pre-wrap; }
  .stat { display:inline-block; background:#1a1a1a; border:1px solid #333; border-radius:8px; padding:12px 20px; margin:6px; text-align:center; min-width:120px; }
  .num  { font-size:28px; font-weight:bold; color:#f0d070; }
</style>
</head>
<body>
<h2>🔄 Migrar Dados Shelly → Firebase</h2>
<p class="warn">⚠️ Execute neste browser (Firefox) onde os dados foram encontrados</p>

<div id="stats" style="margin:16px 0;"></div>

<button class="btn ouro"  onclick="verificar()">🔍 1. Verificar dados</button>
<button class="btn verde" onclick="migrar()"   id="btn-migrar" style="display:none">⬆️ 2. Migrar para Firebase</button>
<button class="btn azul"  onclick="window.open('https://websalaov2.vercel.app','_blank')" style="display:none" id="btn-abrir">🔁 3. Abrir Sistema</button>

<pre id="log">Clique em Verificar...</pre>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, getDocs, writeBatch, doc }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const cfg = {
  apiKey: 'AIzaSyBQcTGkiastpRAjGthU9nHy_uqpQjUMdu0',
  authDomain: 'websalao-2a9d1.firebaseapp.com',
  projectId: 'websalao-2a9d1',
  storageBucket: 'websalao-2a9d1.firebasestorage.app',
  messagingSenderId: '731611795568',
  appId: '1:731611795568:web:103e44f116e152961024b5'
};
const db = getFirestore(initializeApp(cfg));
const logEl = document.getElementById('log');

function log(msg, t='') {
  const ts = new Date().toLocaleTimeString('pt-BR');
  logEl.innerHTML += `<span class="${t||''}">[${ts}] ${msg}</span>\n`;
  logEl.scrollTop = logEl.scrollHeight;
}

// Tenta várias chaves possíveis
function getLocal(...keys) {
  for (const k of keys) {
    try {
      const v = localStorage.getItem(k);
      if (v) {
        const parsed = JSON.parse(v);
        if (Array.isArray(parsed) && parsed.length > 0) return parsed;
        if (parsed && typeof parsed === 'object') return Object.values(parsed);
      }
    } catch {}
  }
  return [];
}

async function batchSet(col, items) {
  if (!items.length) return;
  for (let i = 0; i < items.length; i += 499) {
    const chunk = items.slice(i, i + 499);
    const batch = writeBatch(db);
    chunk.forEach((item, idx) => {
      const id = String(item.id !== undefined ? item.id : (i + idx + 1));
      const data = { ...item, id: isNaN(id) ? id : Number(id) };
      batch.set(doc(db, col, id), data, { merge: true });
    });
    await batch.commit();
  }
}

window.verificar = async function() {
  logEl.innerHTML = '';

  // Buscar com prefixo shelly_
  const ag  = getLocal('shelly_agendamentos', 'agendamentos');
  const wpp = getLocal('shelly_wppMensagens', 'wppMensagens');
  const cli = getLocal('shelly_clientes', 'clientes');
  const svc = getLocal('shelly_servicos', 'servicos');
  const fin = getLocal('shelly_financeiro', 'financeiro');

  log(`Agendamentos (shelly_agendamentos): ${ag.length}`, ag.length > 0 ? 'ok' : 'warn');
  log(`WppMensagens (shelly_wppMensagens): ${wpp.length}`, wpp.length > 0 ? 'ok' : 'warn');
  log(`Clientes (shelly_clientes): ${cli.length}`, cli.length > 0 ? 'ok' : 'warn');
  log(`Serviços (shelly_servicos): ${svc.length}`, svc.length > 0 ? 'ok' : 'warn');
  log(`Financeiro (shelly_financeiro): ${fin.length}`, fin.length > 0 ? 'ok' : 'warn');

  if (ag.length > 0) {
    log('', '');
    log('Amostra de agendamentos:', 'warn');
    ag.slice(0, 3).forEach(a => {
      log(`  ID=${a.id||'?'} | ${a.clienteNome||a.nome||'?'} | ${a.data||'?'} | ${a.status||'?'} | ${a.servicoNome||a.servico||'?'}`, '');
    });
  }

  // Firebase atual
  const snap = await getDocs(collection(db, 'agendamentos'));
  log('', '');
  log(`Firebase atual: ${snap.docs.length} agendamentos`, snap.docs.length > 0 ? 'ok' : 'warn');

  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="num">${ag.length}</div><div>Agendamentos local</div></div>
    <div class="stat"><div class="num">${wpp.length}</div><div>WPP local</div></div>
    <div class="stat"><div class="num">${snap.docs.length}</div><div>Firebase atual</div></div>
  `;

  if (ag.length > 0) {
    document.getElementById('btn-migrar').style.display = 'inline-block';
    log('', '');
    log('✅ Dados encontrados! Clique em "Migrar para Firebase"', 'ok');
  } else {
    log('', '');
    log('❌ Nenhum dado encontrado com prefixo shelly_', 'err');
    log('Todas as chaves no localStorage:', 'warn');
    Object.keys(localStorage).forEach(k => log(`  ${k}: ${localStorage.getItem(k)?.length} chars`, ''));
  }
};

window.migrar = async function() {
  const ag  = getLocal('shelly_agendamentos', 'agendamentos');
  const wpp = getLocal('shelly_wppMensagens', 'wppMensagens');
  const cli = getLocal('shelly_clientes', 'clientes');
  const svc = getLocal('shelly_servicos', 'servicos');
  const fin = getLocal('shelly_financeiro', 'financeiro');

  if (ag.length === 0) { log('❌ Sem dados para migrar', 'err'); return; }

  log('Iniciando migração...', 'warn');
  try {
    await batchSet('agendamentos', ag);
    log(`✅ ${ag.length} agendamentos migrados!`, 'ok');

    await batchSet('wppMensagens', wpp);
    log(`✅ ${wpp.length} mensagens WPP migradas!`, 'ok');

    if (cli.length) { await batchSet('clientes', cli); log(`✅ ${cli.length} clientes`, 'ok'); }
    if (svc.length) { await batchSet('servicos', svc); log(`✅ ${svc.length} serviços`, 'ok'); }
    if (fin.length) { await batchSet('financeiro', fin); log(`✅ ${fin.length} financeiro`, 'ok'); }

    // Também salvar com chaves novas no localStorage
    localStorage.setItem('agendamentos', localStorage.getItem('shelly_agendamentos') || '[]');
    localStorage.setItem('wppMensagens', localStorage.getItem('shelly_wppMensagens') || '[]');
    localStorage.setItem('clientes', localStorage.getItem('shelly_clientes') || '[]');
    localStorage.setItem('servicos', localStorage.getItem('shelly_servicos') || '[]');
    localStorage.setItem('financeiro', localStorage.getItem('shelly_financeiro') || '[]');

    const snap = await getDocs(collection(db, 'agendamentos'));
    log('', '');
    log(`🎉 MIGRAÇÃO COMPLETA! Firebase agora tem ${snap.docs.length} agendamentos`, 'ok');
    log('Clique em "Abrir Sistema"', 'ok');
    document.getElementById('btn-abrir').style.display = 'inline-block';
  } catch(e) {
    log('ERRO: ' + e.message, 'err');
  }
};

setTimeout(window.verificar, 300);
</script>
</body>
</html>
