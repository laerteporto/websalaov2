<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Confirmação de Agendamento</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #d4a373;
            --primary-dark: #bc8a5f;
            --bg: #f9f9f9;
            --bg-card: #ffffff;
            --text: #333333;
            --text-muted: #777777;
            --border: #eeeeee;
            --green: #2ecc71;
            --green-dark: #27ae60;
            --red: #e74c3c;
            --red-dark: #c0392b;
            --radius: 16px;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            font-family: 'Outfit', sans-serif;
            color: var(--text);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            margin-top: 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header p {
            margin: 5px 0 0;
            font-size: 14px;
            color: var(--text-muted);
        }

        .card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
            border: 1px solid var(--border);
        }

        .status-badge {
            display: inline-block;
            background: #fff3cd;
            color: #856404;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .greeting {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 15px;
            color: var(--text-muted);
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .price-box {
            text-align: center;
            margin-bottom: 24px;
        }

        .price-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .price {
            font-size: 42px;
            font-weight: 700;
            color: var(--primary-dark);
            margin: 0;
        }

        .details-box {
            background: var(--bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
        }

        .details-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .details-row:last-child {
            margin-bottom: 0;
        }

        .details-label {
            color: var(--text-muted);
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .details-value {
            font-weight: 600;
            font-size: 14px;
            text-align: right;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s;
        }

        .btn-green {
            background: var(--green);
            color: white;
            box-shadow: 0 4px 12px rgba(46, 204, 113, 0.3);
        }

        .btn-green:hover {
            background: var(--green-dark);
        }

        .btn-red {
            background: white;
            color: var(--red);
            border: 2px solid var(--red);
        }

        .btn-red:hover {
            background: #fff5f5;
        }

        .loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 200px;
            gap: 15px;
            color: var(--text-muted);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: var(--green);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto 20px;
        }

        .cancel-icon {
            width: 80px;
            height: 80px;
            background: var(--red);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        #app {
            display: none;
        }

        #message-box {
            display: none;
            text-align: center;
            padding: 40px 20px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header">
            <h1>Studio Shelly Rodrigues</h1>
            <p>Confirmação de Agendamento</p>
        </div>

        <!-- Carregando -->
        <div id="loader" class="loader">
            <div class="spinner"></div>
            <div>Buscando agendamento...</div>
        </div>

        <!-- Card Principal -->
        <div id="app" class="card">
            <div style="text-align: center;">
                <div class="status-badge">⏳ Aguardando sua resposta</div>
            </div>

            <div class="greeting">Olá, <span id="cli-nome"></span> 👋</div>
            <div class="subtitle">Segue os detalhes do seu agendamento no salão para a realização de <b><span
                        id="svc-nome-txt"></span></b>.</div>

            <div class="price-box">
                <div class="price-label">Valor do Serviço</div>
                <div class="price">R$ <span id="svc-preco"></span></div>
            </div>

            <div class="details-box">
                <div class="details-row">
                    <div class="details-label">📅 Data</div>
                    <div class="details-value" id="ag-data"></div>
                </div>
                <div class="details-row">
                    <div class="details-label">⏰ Horário</div>
                    <div class="details-value" id="ag-hora"></div>
                </div>
                <div class="details-row">
                    <div class="details-label">✨ Serviço</div>
                    <div class="details-value" id="svc-nome"></div>
                </div>
            </div>

            <div class="actions">
                <button class="btn btn-green" onclick="responder('sim')">
                    ✓ Aprovar Agendamento
                </button>
                <button class="btn btn-red" onclick="responder('nao')">
                    ✕ Recusar Agendamento
                </button>
            </div>
        </div>

        <!-- Mensagem de Sucesso/Erro -->
        <div id="message-box" class="card">
            <div id="msg-icon"></div>
            <h2 id="msg-title" style="margin: 0 0 10px; color: var(--text);"></h2>
            <p id="msg-desc" style="color: var(--text-muted); line-height: 1.5; margin: 0;"></p>
        </div>
    </div>

    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBQcTGkiastpRAjGthU9nHy_uqpQjUMdu0",
            authDomain: "websalao-2a9d1.firebaseapp.com",
            projectId: "websalao-2a9d1",
            storageBucket: "websalao-2a9d1.firebasestorage.app",
            messagingSenderId: "731611795568",
            appId: "1:731611795568:web:103e44f116e152961024b5"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        function fmtDate(str) {
            if (!str) return '';
            const [y, m, d] = str.split('-');
            return `${d || ''}/${m || ''}/${y || ''}`;
        }

        let wppMsgId = null;
        let agData = null;
        let agIdStr = null;

        async function loadData() {
            const urlParams = new URLSearchParams(window.location.search);
            const agId = urlParams.get('id');

            if (!agId) {
                showError('Link inválido', 'Nenhum agendamento encontrado neste link.');
                return;
            }

            agIdStr = agId;

            try {
                const qMsg = query(collection(db, "wppMensagens"), where("agId", "==", Number(agId)));
                const snapMsg = await getDocs(qMsg);

                let msgData = null;
                if (!snapMsg.empty) {
                    let list = snapMsg.docs.map(d => ({ docId: d.id, ...d.data() }));
                    list.sort((a, b) => b.id - a.id);
                    msgData = list[0];
                    wppMsgId = msgData.docId;
                }

                const qAg = query(collection(db, "agendamentos"), where("id", "==", Number(agId)));
                const snapAg = await getDocs(qAg);

                if (!snapAg.empty) {
                    agData = snapAg.docs[0].data();
                }

                if (!msgData || !agData) {
                    showError('Agendamento não encontrado', 'Os detalhes não puderam ser recuperados.');
                    return;
                }

                if (msgData.resposta === 'sim') {
                    showSuccess('Já Confirmado', 'Você já confirmou este agendamento anteriormente. Te esperamos no salão!');
                    return;
                } else if (msgData.resposta === 'nao') {
                    showError('Já Cancelado', 'Você já cancelou este agendamento anteriormente.');
                    return;
                }

                document.getElementById('cli-nome').textContent = msgData.clienteNome.split(' ')[0];
                document.getElementById('svc-nome-txt').textContent = msgData.servico;
                document.getElementById('svc-nome').textContent = msgData.servico;
                document.getElementById('ag-data').textContent = fmtDate(msgData.data);
                document.getElementById('ag-hora').textContent = msgData.hora;

                let valor = agData.valor ? parseFloat(agData.valor).toFixed(2).replace('.', ',') : 'A consultar';
                document.getElementById('svc-preco').textContent = valor;

                document.getElementById('loader').style.display = 'none';
                document.getElementById('app').style.display = 'block';

            } catch (e) {
                console.error(e);
                showError('Erro de conexão', 'Falha ao conectar com o servidor. Tente novamente mais tarde.');
            }
        }

        window.responder = async function (resp) {
            if (!wppMsgId || !agIdStr) return;

            document.querySelectorAll('.btn').forEach(b => b.disabled = true);
            document.querySelectorAll('.btn').forEach(b => b.style.opacity = '0.7');

            try {
                await updateDoc(doc(db, "wppMensagens", String(wppMsgId)), {
                    resposta: resp,
                    respostaEm: new Date().toISOString()
                });

                const novoStatus = resp === 'sim' ? 'confirmado' : 'cancelado';
                await updateDoc(doc(db, "agendamentos", String(agIdStr)), {
                    status: novoStatus,
                    wppResposta: resp
                });

                if (resp === 'sim') {
                    showSuccess('Agendamento Confirmado!', 'Recebemos sua confirmação. Lhe aguardamos no salão no horário combinado!');
                } else {
                    showError('Agendamento Cancelado', 'Entendemos o seu imprevisto. Você será sempre bem-vindo(a) para remarcar em outra data!');
                }
            } catch (e) {
                console.error(e);
                alert('Ocorreu um erro ao salvar a resposta. Tente novamente.');
                document.querySelectorAll('.btn').forEach(b => b.disabled = false);
                document.querySelectorAll('.btn').forEach(b => b.style.opacity = '1');
            }
        };

        function showSuccess(title, desc) {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('app').style.display = 'none';
            document.getElementById('msg-icon').innerHTML = '<div class="success-icon">✓</div>';
            document.getElementById('msg-title').textContent = title;
            document.getElementById('msg-desc').textContent = desc;
            document.getElementById('message-box').style.display = 'block';
        }

        function showError(title, desc) {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('app').style.display = 'none';
            document.getElementById('msg-icon').innerHTML = '<div class="cancel-icon">✕</div>';
            document.getElementById('msg-title').textContent = title;
            document.getElementById('msg-desc').textContent = desc;
            document.getElementById('message-box').style.display = 'block';
        }

        loadData();
    </script>
</body>

</html>
